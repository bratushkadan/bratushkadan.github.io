title: bratushkadan – Software Engineer & Pinterest Corporate Girl Aesthetics Enjoy 💅✨
description: >-
  я comporate girl 💅🏻 я люблю aestethics 🫧🎀 у меня ноготочки цвета «согласовано с моей стороны» 🤍 и блеск Dior, который красиво отпечатывается на крышечке айс-латте из Surf Coffee 🧋💋 кофе стоил 490₽, ещё 70 за кокосовое, потому что от обычного у меня вздутие, а у меня в 10:30 камера 📸

  прихожу в офис, пикаю пропуском, сумку Guess сажаю на отдельный стул 👜🤎 открываю макбук, открываю календарь, закрываю календарь. господи, уже столько всего сделала 🥹 в 11 у нас синк перед созвоном, надо договориться, кто на созвоне скажет «давайте начнём». в итоге сказала я 🤭✨ потихоньку выхожу в лидерство 📈

  пишу в чат «Машуль, приветик! а когда сможем посмотреть финальчик? 🌸» Машуля знает, что цветочек я ставлю один раз. на второй раз в копии будет Ольга Викторовна 💌

  в 16:58 какой-то мужчина без аватарки пишет «привет» и ждёт, пока я отвечу. сладкий, у меня два процента на айфоне, один живой волос после дайсона и ноль причин помогать тебе сформулировать мысль 🎀🫶🏻

  вечером на манике мастер спрашивает «длину оставляем?» я на автомате говорю «давай пока зафиксируем текущую, если что — вернусь с комментами» 💅🏻 она молча пилит. наконец-то человек, который умеет работать асинхронно 🥹💖
